<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/blueprint-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blueprint studio | Architectural Rigor for the Generative Era</title>
    <script>
      (function () {
        try {
          var userSet = localStorage.getItem('blueprint_theme_user_set') === '1';
          var stored = userSet ? localStorage.getItem('blueprint_theme') : null;
          var pref =
            userSet && (stored === 'light' || stored === 'dark' || stored === 'system')
              ? stored
              : 'system';
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = pref === 'dark' || (pref === 'system' && systemDark);
          var root = document.documentElement;
          root.classList.add(isDark ? 'dark' : 'light');
          root.style.backgroundColor = isDark ? '#101113' : '#f8fafc';
          document.body.style.backgroundColor = isDark ? '#101113' : '#f8fafc';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
