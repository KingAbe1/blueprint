name: Feature request
description: Suggest an improvement (greenfield, brownfield, or platform)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Greenfield (brief / interview / handoff)
        - Brownfield (scan / quality / Next.js)
        - AI providers
        - Desktop (Tauri)
        - Docs / other
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy alignment
      options:
        - label: This idea keeps user data local by default (or is explicitly opt-in)
          required: true
